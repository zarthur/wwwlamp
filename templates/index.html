<!DOCTYPE html>
<html>
    <head>
        <%include file='head_base.html'/>
        <title>Controller</title>
    </head>
    <body>
        <div data-role="page" id="page1">
            <div data-theme="a" data-role="header">
                <h2>
                    wwwlamp
                </h2>
            </div>
            <div data-role="content" style="padding: 10px">
                <h3 align="center">
                    Lamps
                </h3>
                <p id="connection" role="status">${error or ""}</p>
                <button id="refresh-status" type="button">Refresh status</button>
                <div id="switches">
                    <form action="index" method="post">
                        <div data-role="fieldcontain">
                            <fieldset data-role="controlgroup" data-type="vertical">
                                <table border="0" width="95%">
                                    <tr>
                                        <td>
                                            <label for="toggleswitch0">
                                                Living Room
                                            </label>
                                        </td>
                                        <td class="text-align-right">
                                            <select class="switch" name="toggleswitch0"
                                                    id="toggleswitch0" data-theme="" data-role="none">
                                                <option value="unknown" disabled="disabled">Unknown</option>
                                                <option value="off"
                                                % if states['living'] is False:
                                                    selected="selected"
                                                % endif
                                                >
                                                    Off
                                                </option>
                                                <option value="on"
                                                % if states['living']:
                                                    selected="selected"
                                                % endif
                                                >
                                                    On
                                                </option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="toggleswitch1">
                                                Bedroom
                                            </label>
                                        </td>
                                        <td class="text-align-right">
                                            <select class="switch" name="toggleswitch1"
                                                    id="toggleswitch1" data-theme="" data-role="none">
                                                <option value="unknown" disabled="disabled">Unknown</option>
                                                <option value="off"
                                                % if states['bedroom'] is False:
                                                    selected="selected"
                                                % endif
                                                >
                                                    Off
                                                </option>
                                                <option value="on"
                                                % if states['bedroom']:
                                                    selected="selected"
                                                % endif
                                                >
                                                    On
                                                </option>
                                            </select>
                                        </td>
                                    </tr>
                                </table>
                            </fieldset>
                        </div>
                   </form>
                </div>
            </div>
        </div>
        <script>
            $(document).bind('pageinit', function() {
                var busy = false;
                var initial = ${__import__('json').dumps(states) | n};
                function show(states) {
                    $.each({living: '#toggleswitch0', bedroom: '#toggleswitch1'}, function(room, selector) {
                        $(selector).val(states[room] === null ? 'unknown' : (states[room] ? 'on' : 'off'));
                    });
                }
                function lock(value) {
                    busy = value;
                    $('.switch').prop('disabled', value);
                    $('#refresh-status').prop('disabled', value);
                }
                function refresh(message) {
                    lock(true);
                    $.ajax({url: 'status', dataType: 'json', timeout: 10000,
                        success: function(data) {
                            show(data.states);
                            $('#connection').text(message || 'Status refreshed.');
                        },
                        error: function() {
                            show({living: null, bedroom: null});
                            $('#connection').text('Hardware unavailable. State is unknown; refresh status to reconnect.');
                        },
                        complete: function() { lock(false); }
                    });
                }
                show(initial);
                $('#refresh-status').click(function() { if (!busy) refresh(); });
                $('.switch').change(function() {
                    if (busy) return;
                    var data = {};
                    data[this.name] = this.value;
                    lock(true);
                    $.ajax({type: 'POST', url: 'index', data: data, dataType: 'json', timeout: 10000,
                        success: function(result) {
                            show(result.states);
                            $('#connection').text('Command accepted.');
                            lock(false);
                        },
                        error: function() {
                            refresh('Command outcome was uncertain. Showing latest controller state.');
                        }
                    });
                });
            });
        </script>
    </body>
</html>
