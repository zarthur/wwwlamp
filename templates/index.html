<!DOCTYPE html>
<html lang="en">
    <head>
        <%include file='head_base.html'/>
        <title>Controller</title>
    </head>
    <body>
        <header><h1>wwwlamp</h1></header>
        <main>
            <h2>Lamps</h2>
            <p id="connection" role="status">${error or ""}</p>
            <button id="refresh-status" type="button">Refresh status</button>
            <form id="switches" action="index" method="post">
                % for room, label, field in [('living', 'Living Room', 'toggleswitch0'), ('bedroom', 'Bedroom', 'toggleswitch1')]:
                <div class="lamp">
                    <label for="${field}">${label}</label>
                    <select class="switch" name="${field}" id="${field}">
                        % for value, title, state in [('unknown', 'Unknown', None), ('off', 'Off', False), ('on', 'On', True)]:
                        <option value="${value}" ${'selected' if states[room] is state else ''} ${'disabled' if state is None else ''}>${title}</option>
                        % endfor
                    </select>
                </div>
                % endfor
            </form>
        </main>
        <script src="public/js/controller.js" defer></script>
    </body>
</html>
